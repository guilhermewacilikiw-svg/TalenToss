version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: talentai_db
    environment:
      POSTGRES_USER: talentai
      POSTGRES_PASSWORD: talentai_password
      POSTGRES_DB: talentai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: talentai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
